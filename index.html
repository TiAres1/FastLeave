<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>7sTools | FastLeave</title>
    <meta name="description" content="Quickly leave multiple Discord servers | FastLeave by 7sTools">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #030305;
            --surface: #0c0c10;
            --surface-2: #141418;
            --border: rgba(255,255,255,0.06);
            --border-bright: rgba(255,255,255,0.14);
            --text: #f0f0f8;
            --muted: #505060;
            --accent: #e8e8ff;
            --gold: #c8a84b;
            --danger: #ff4d4d;
            --r-sm: 8px;
            --r-md: 14px;
            --r-lg: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--black);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── CANVAS BACKGROUND ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ── HEADER ── */
        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            height: 64px;
            padding-top: env(safe-area-inset-top);
            border-bottom: 1px solid var(--border);
            background: rgba(3,3,5,0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 100;
            gap: 2rem;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,168,75,0.4), transparent);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text);
            white-space: nowrap;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #5865f2, #404eed);
            border-radius: 8px;
            display: grid;
            place-content: center;
            font-size: 0.8rem;
            color: #fff;
            box-shadow: 0 0 20px rgba(88,101,242,0.4);
        }

        .logo-sep { color: var(--muted); margin: 0 2px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: flex-end;
        }

        .search-wrap {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.75rem;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            padding: 9px 14px 9px 36px;
            border-radius: var(--r-sm);
            transition: border-color 0.2s, background 0.2s;
        }
        #searchInput:focus { outline: none; border-color: var(--border-bright); background: var(--surface-2); }
        #searchInput:disabled { opacity: 0.3; cursor: not-allowed; }
        #searchInput::placeholder { color: var(--muted); }

        .btn-web {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-bright);
            border-radius: var(--r-sm);
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-web:hover { color: var(--text); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); }

        /* ── MAIN ── */
        main {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #222 transparent;
        }
        main::-webkit-scrollbar { width: 4px; }
        main::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

        /* ── LOGIN ── */
        .login-panel {
            display: none;
            min-height: 100%;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            perspective: 1200px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 3rem;
            position: relative;
            transform-style: preserve-3d;
            animation: cardFloat 6s ease-in-out infinite;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
        }

        @keyframes cardFloat {
            0%, 100% { transform: rotateX(2deg) rotateY(-1deg) translateY(0px); }
            33% { transform: rotateX(-1deg) rotateY(2deg) translateY(-8px); }
            66% { transform: rotateX(1deg) rotateY(-2deg) translateY(-4px); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--r-lg);
            padding: 1px;
            background: linear-gradient(135deg, rgba(200,168,75,0.3), transparent 40%, transparent 60%, rgba(88,101,242,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .login-card::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            background: radial-gradient(ellipse, rgba(200,168,75,0.15) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(10px);
        }

        .login-eyebrow {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .login-card h2 {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }

        .login-card p {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .field-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .input-wrap { display: flex; flex-direction: column; gap: 1.25rem; }

        input[type="password"] {
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.25s;
        }
        input[type="password"]:focus { outline: none; border-color: rgba(200,168,75,0.5); background: rgba(200,168,75,0.03); box-shadow: 0 0 0 3px rgba(200,168,75,0.08); }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }
        .remember-row:hover { color: var(--text); }
        .remember-row input {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-bright);
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: 0.15s;
        }
        .remember-row input::before { content: ""; width: 8px; height: 8px; background: var(--gold); transform: scale(0); transition: 120ms transform; border-radius: 2px; }
        .remember-row input:checked { border-color: var(--gold); }
        .remember-row input:checked::before { transform: scale(1); }

        #loadServers {
            margin-top: 0.5rem;
            padding: 16px;
            background: var(--text);
            color: var(--black);
            border: none;
            border-radius: var(--r-sm);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #loadServers:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 16px 40px rgba(240,240,248,0.15); }

        /* ── DASHBOARD ── */
        .dashboard {
            display: none;
            max-width: 1500px;
            margin: 0 auto;
            padding: 2.5rem 2.5rem;
            width: 100%;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border);
            width: 100%;
        }
        .tab {
            padding: 10px 24px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: -1px;
        }
        .tab.active { color: var(--text); border-bottom-color: var(--gold); }
        .tab:hover:not(.active) { color: var(--text); }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .stats span { color: var(--text); }

        .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

        .btn-text {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-text:hover { color: var(--text); border-color: var(--border-bright); background: rgba(255,255,255,0.02); }

        /* ── SERVER GRID ── */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
        }

        /* ── SERVER CARD (3D) ── */
        .card-scene {
            perspective: 800px;
            cursor: pointer;
        }

        .server-card {
            position: relative;
            height: 210px;
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            background: var(--surface);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.23,1,0.32,1), border-color 0.3s, box-shadow 0.4s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-scene:hover .server-card {
            border-color: var(--border-bright);
            box-shadow: 0 24px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
        }

        .server-card.selected {
            border-color: rgba(200,168,75,0.5) !important;
            background: linear-gradient(135deg, rgba(200,168,75,0.05), var(--surface));
            box-shadow: 0 0 0 1px rgba(200,168,75,0.15), 0 20px 40px rgba(0,0,0,0.6) !important;
        }

        .server-card.locked { opacity: 0.4; pointer-events: none; }

        /* Banner */
        .card-banner {
            height: 72px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .card-banner-inner {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .card-scene:hover .card-banner-inner { transform: scale(1.06); }

        .card-banner-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 30%, var(--surface) 100%);
        }

        /* Avatar */
        .card-avatar {
            position: absolute;
            top: 38px;
            left: 18px;
            width: 56px;
            height: 56px;
            border-radius: 12px;
            border: 2px solid var(--surface);
            background: var(--surface-2);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--muted);
            z-index: 2;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            transition: transform 0.3s;
        }
        .card-scene:hover .card-avatar { transform: scale(1.05) translateZ(8px); }

        /* Checkbox */
        .card-check {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 22px;
            height: 22px;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }
        .card-scene:hover .card-check, .server-card.selected .card-check { opacity: 1; transform: scale(1); }
        .server-card.selected .card-check { background: var(--gold); border-color: var(--gold); }
        .card-check i { font-size: 10px; color: var(--black); display: none; }
        .server-card.selected .card-check i { display: block; }

        /* Card content */
        .card-body {
            flex: 1;
            padding: 36px 18px 14px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
        }

        .card-name-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .card-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.01em;
        }

        .card-badges { display: flex; gap: 4px; flex-shrink: 0; }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .badge.owner { background: rgba(200,168,75,0.12); color: var(--gold); border: 1px solid rgba(200,168,75,0.2); }
        .badge.admin { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border: 1px solid var(--border); }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2px;
        }

        .card-id {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
        }

        .btn-link {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid transparent;
            color: var(--muted);
            font-size: 0.7rem;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.15s;
        }
        .btn-link:hover { background: rgba(255,255,255,0.08); color: var(--text); border-color: var(--border); }

        /* locked icon */
        .server-card.locked::after {
            content: "\f023";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 12px;
            left: 12px;
            color: var(--muted);
            font-size: 0.75rem;
            z-index: 5;
        }

        /* ── DROPDOWN ── */
        .dropdown { position: relative; }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #0f0f13;
            border: 1px solid var(--border-bright);
            border-radius: var(--r-sm);
            min-width: 180px;
            z-index: 200;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            animation: menuIn 0.12s ease-out;
        }
        @keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .dropdown-menu a {
            display: block;
            padding: 10px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: all 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }
        .dropdown-menu a:last-child { border-bottom: none; }
        .dropdown-menu a:hover { background: rgba(255,255,255,0.04); color: var(--text); padding-left: 18px; }
        .dropdown-menu a.active { color: var(--gold); background: rgba(200,168,75,0.05); }
        .dropdown-menu a.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold); }

        /* ── ACTION BAR ── */
        .action-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: fit-content;
            margin: 2.5rem auto 0;
            padding: 14px 20px 14px 24px;
            background: var(--text);
            color: var(--black);
            border-radius: 100px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
            animation: barIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes barIn { from { transform: scale(0.85) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        .action-bar.visible { display: flex; }

        .sel-count {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-leave {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px 10px 16px;
            background: var(--black);
            color: var(--text);
            border: none;
            border-radius: 50px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }
        .btn-leave:hover { background: #1a1a22; transform: scale(1.03); }

        /* ── PAGINATION ── */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
        }
        .pagination button {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.75rem;
        }
        .pagination button:hover:not(:disabled) { background: rgba(255,255,255,0.06); color: var(--text); border-color: var(--border-bright); }
        .pagination button:disabled { opacity: 0.2; cursor: not-allowed; }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 24px;
            background: rgba(12,12,16,0.95);
            border: 1px solid var(--border-bright);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            border-radius: 100px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34,1.2,0.64,1);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success i { color: #4ade80; }
        .toast.error i { color: #f87171; }

        /* ── MOBILE ── */
        .mobile-only { display: none !important; }

        @media (max-width: 768px) {
            header { padding: 0 1.25rem; padding-top: env(safe-area-inset-top); }
            .mobile-only { display: grid !important; }

            .search-wrap {
                position: absolute;
                inset: 0;
                padding: 0 1rem;
                padding-top: env(safe-area-inset-top);
                background: var(--black);
                backdrop-filter: blur(20px);
                max-width: none;
                display: flex;
                align-items: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 80;
            }
            header.search-mode .search-wrap { opacity: 1; pointer-events: auto; }

            .search-close { 
                position: absolute;
                right: 18px;
                top: 50%;
                transform: translateY(-50%);
                padding-top: env(safe-area-inset-top);
                color: var(--muted);
                cursor: pointer;
                pointer-events: auto !important;
            }
            .search-close { left: auto !important; font-size: 0.9rem !important; display: block; }

            .btn-icon-hdr {
                width: 36px;

<script>
/* ── CANVAS PARTICLE SYSTEM ── */
(function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], lines = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = (Math.random() - 0.5) * 0.2;
            this.r = Math.random() * 1.5 + 0.3;
            this.life = Math.random();
            this.speed = Math.random() * 0.003 + 0.001;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life += this.speed;
            if (this.life > 1) this.life = 0;
            if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
        }
        draw() {
            const a = Math.sin(this.life * Math.PI) * 0.6;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200,168,75,${a * 0.4})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    // Static grid dots
    function drawGrid() {
        const spacing = 60;
        ctx.fillStyle = 'rgba(255,255,255,0.025)';
        for (let x = 0; x < W; x += spacing) {
            for (let y = 0; y < H; y += spacing) {
                ctx.beginPath();
                ctx.arc(x, y, 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawConnections() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const a = (1 - dist / 120) * 0.08;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(200,168,75,${a})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function loop() {
        ctx.clearRect(0, 0, W, H);
        drawGrid();
        particles.forEach(p => { p.update(); p.draw(); });
        drawConnections();
        requestAnimationFrame(loop);
    }

    resize();
    window.addEventListener('resize', resize);
    loop();
})();

/* ── 3D CARD TILT ── */
function initTilt(card) {
    const scene = card.closest('.card-scene');
    if (!scene) return;
    scene.addEventListener('mousemove', (e) => {
        const rect = scene.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const rx = ((e.clientY - cy) / (rect.height / 2)) * -8;
        const ry = ((e.clientX - cx) / (rect.width / 2)) * 8;
        card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px)`;
    });
    scene.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0) rotateY(0) translateZ(0)';
    });
}

/* ── APP STATE ── */
const API = 'https://discord.com/api/v10';
let token = '';
let currentTab = 'servers';
let allGuilds = [], origGuilds = [];
let allDMs = [], origDMs = [];
let selectedGuilds = new Set(), selectedDMs = new Set();
let lockedGuilds = new Set(), lockedDMs = new Set();
let currentPage = 1;
let perPage = window.innerWidth > 768 ? 20 : 10;
let sortCriteria = null;
let isProcessing = false;
let isInviting = false;

const el = {
    tokenInput: document.getElementById('tokenInput'),
    remember: document.getElementById('rememberToken'),
    loadBtn: document.getElementById('loadServers'),
    loginPanel: document.getElementById('loginPanel'),
    dashboard: document.getElementById('dashboard'),
    serversGrid: document.getElementById('serversContainer'),
    dmsGrid: document.getElementById('dmsContainer'),
    search: document.getElementById('searchInput'),
    itemCount: document.getElementById('itemCount'),
    itemType: document.getElementById('itemType'),
    selectAll: document.getElementById('selectAllBtn'),
    actionBar: document.getElementById('actionBar'),
    selCount: document.getElementById('selectedCount'),
    selType: document.getElementById('selectedType'),
    processBtn: document.getElementById('processBtn'),
    toast: document.getElementById('toast'),
    export: document.getElementById('exportBtn'),
    refresh: document.getElementById('refreshBtn'),
    logout: document.getElementById('logoutBtn'),
    prev: document.getElementById('prevPage'),
    next: document.getElementById('nextPage'),
    pageInfo: document.getElementById('pageInfo'),
    mobileSearch: document.getElementById('mobileSearchBtn'),
    searchWrap: document.getElementById('searchWrap'),
    searchClose: document.getElementById('searchClose'),
    header: document.getElementById('header'),
};

// Init
window.addEventListener('DOMContentLoaded', () => {
    showLogin();
    const saved = localStorage.getItem('discord_token');
    if (saved) {
        el.tokenInput.value = saved;
        el.remember.checked = true;
        loadServers();
    }
});

window.addEventListener('resize', () => {
    const p = window.innerWidth > 768 ? 20 : 10;
    if (p !== perPage) { perPage = p; currentPage = 1; renderCurrent(); }
});

// Events
el.loadBtn.addEventListener('click', loadServers);
el.search.addEventListener('input', filterItems);
el.selectAll.addEventListener('click', toggleSelectAll);
el.processBtn.addEventListener('click', processSelected);
el.export.addEventListener('click', exportList);
el.refresh.addEventListener('click', () => currentTab === 'servers' ? loadServers() : loadDMs());
el.logout.addEventListener('click', logout);
el.prev.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderCurrent(); } });
el.next.addEventListener('click', () => {
    const items = currentTab === 'servers' ? allGuilds : allDMs;
    const total = Math.ceil(items.length / perPage);
    if (currentPage < total) { currentPage++; renderCurrent(); }
});

el.mobileSearch.addEventListener('click', () => {
    el.header.classList.add('search-mode');
    setTimeout(() => el.search.focus(), 120);
});
el.searchClose.addEventListener('click', () => {
    el.header.classList.remove('search-mode');
    el.search.value = '';
    filterItems();
});

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

// Dropdowns
function setupDropdown(triggerId, menuId) {
    const btn = document.getElementById(triggerId);
    const menu = document.getElementById(menuId);
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = menu.style.display === 'block';
        document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        menu.style.display = open ? 'none' : 'block';
    });
}
setupDropdown('sortTrigger', 'sortMenu');
setupDropdown('smartTrigger', 'smartMenu');
document.addEventListener('click', () => document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none'));

document.querySelectorAll('[data-sort]').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); sortItems(e.target.dataset.sort, e.target); });
});
document.querySelectorAll('[data-action]').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); handleSmartSelect(e.target.dataset.action, e.target); });
});

// ── FUNCTIONS ──
function showLogin() {
    el.loginPanel.style.display = 'flex';
    el.dashboard.style.display = 'none';
}

function showToast(msg, type = 'success') {
    const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-xmark';
    el.toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
    el.toast.className = `toast show ${type}`;
    setTimeout(() => el.toast.classList.remove('show'), 3000);
}

function logout() {
    localStorage.removeItem('discord_token');
    token = '';
    el.tokenInput.value = '';
    allGuilds = []; allDMs = [];
    selectedGuilds.clear(); selectedDMs.clear();
    lockedGuilds.clear(); lockedDMs.clear();
    updateActionBar();
    showLogin();
    showToast('Logged out');
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    currentTab = tab;
    currentPage = 1;
    el.serversGrid.style.display = tab === 'servers' ? 'grid' : 'none';
    el.dmsGrid.style.display = tab === 'dms' ? 'grid' : 'none';
    if (tab === 'dms' && allDMs.length === 0) loadDMs();
    else renderCurrent();
    updateStats();
    updateActionBar();
    // Update smart select menu
    const smartMenu = document.getElementById('smartMenu');
    if (tab === 'servers') {
        smartMenu.innerHTML = `<a href="#" data-action="no-icon">No Icon</a><a href="#" data-action="non-admin">Not Admin/Owner</a>`;
    } else {
        smartMenu.innerHTML = `<a href="#" data-action="bots">Bots</a><a href="#" data-action="groups">Groups</a><a href="#" data-action="users">Users</a>`;
    }
    smartMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); handleSmartSelect(e.target.dataset.action, e.target); }));
}

function renderCurrent() {
    if (currentTab === 'servers') renderServers(allGuilds);
    else renderDMs(allDMs);
}

function updateStats() {
    const items = currentTab === 'servers' ? allGuilds : allDMs;
    el.itemCount.textContent = items.length;
    el.itemType.textContent = currentTab === 'servers' ? 'Servers' : 'DMs';
}

function updateActionBar() {
    const set = currentTab === 'servers' ? selectedGuilds : selectedDMs;
    const n = set.size;
    el.selCount.textContent = n;
    el.selType.textContent = currentTab;
    el.processBtn.innerHTML = `<i class="fas fa-arrow-right-from-bracket"></i> ${currentTab === 'servers' ? 'Leave' : 'Close'} Selected`;
    if (n > 0) { el.actionBar.classList.add('visible'); }
    else { el.actionBar.classList.remove('visible'); }
}

async function loadServers() {
    token = el.tokenInput.value.trim();
    if (!token) { showToast('Please enter your token', 'error'); return; }
    if (el.remember.checked) localStorage.setItem('discord_token', token);
    else localStorage.removeItem('discord_token');
    el.loadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading…';
    el.loadBtn.disabled = true;
    try {
        let res = await fetch(`${API}/users/@me/guilds`, { headers: { Authorization: token } });
        if (res.status === 429) {
            const d = await res.json();
            await new Promise(r => setTimeout(r, d.retry_after * 1000 + 1000));
            res = await fetch(`${API}/users/@me/guilds`, { headers: { Authorization: token } });
        }
        if (!res.ok) {
            if (res.status === 401) { localStorage.removeItem('discord_token'); showLogin(); throw new Error('Invalid token. Please try again.'); }
            throw new Error('Failed to load servers.');
        }
        allGuilds = await res.json();
        origGuilds = [...allGuilds];
        el.loginPanel.style.display = 'none';
        el.dashboard.style.display = 'block';
        el.search.disabled = false;
        currentPage = 1;
        renderServers(allGuilds);
        updateStats();
        showToast(`Loaded ${allGuilds.length} servers`);
    } catch (e) { showToast(e.message, 'error'); }
    finally { el.loadBtn.innerHTML = '<i class="fas fa-bolt"></i> Load Servers'; el.loadBtn.disabled = false; }
}

async function loadDMs() {
    token = el.tokenInput.value.trim();
    if (!token) return;
    el.refresh.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    el.refresh.disabled = true;
    try {
        let res = await fetch(`${API}/users/@me/channels`, { headers: { Authorization: token } });
        if (!res.ok) throw new Error('Failed to load DMs.');
        allDMs = (await res.json()).filter(c => c.type === 1 || c.type === 3);
        origDMs = [...allDMs];
        currentPage = 1;
        renderDMs(allDMs);
        updateStats();
        showToast(`Loaded ${allDMs.length} DMs`);
    } catch (e) { showToast(e.message, 'error'); }
    finally { el.refresh.innerHTML = '<i class="fas fa-rotate-right"></i> Refresh'; el.refresh.disabled = false; }
}

function renderServers(guilds) {
    const total = Math.ceil(guilds.length / perPage);
    const start = (currentPage - 1) * perPage;
    const page = guilds.slice(start, start + perPage);
    el.itemCount.textContent = guilds.length;
    el.pageInfo.textContent = `${currentPage} / ${total || 1}`;
    el.prev.disabled = currentPage === 1;
    el.next.disabled = currentPage >= total;
    el.serversGrid.innerHTML = '';
    const frag = document.createDocumentFragment();
    page.forEach(g => {
        const scene = document.createElement('div');
        scene.className = 'card-scene';
        const card = document.createElement('div');
        const locked = lockedGuilds.has(g.id);
        const selected = selectedGuilds.has(g.id);
        card.className = `server-card ${selected ? 'selected' : ''} ${locked ? 'locked' : ''}`;
        card.dataset.id = g.id;
        const iconUrl = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png` : null;
        const bannerUrl = g.banner ? `https://cdn.discordapp.com/banners/${g.id}/${g.banner}.png?size=1024` : null;
        const isOwner = g.owner;
        const isAdmin = (BigInt(g.permissions) & 0x8n) === 0x8n;
        const badge = isOwner ? `<span class="badge owner">Owner</span>` : isAdmin ? `<span class="badge admin">Admin</span>` : '';
        const iconStyle = iconUrl ? `background-image: url('${iconUrl}'); font-size:0;` : '';
        const bannerStyle = bannerUrl ? `background-image: url('${bannerUrl}'); background-size: cover; background-position: center;` : `background: linear-gradient(135deg, #1a1a28, #0c0c14);`;
        card.innerHTML = `
            <div class="card-banner">
                <div class="card-banner-inner" style="${bannerStyle}"></div>
                <div class="card-banner-fade"></div>
            </div>
            <div class="card-avatar" style="${iconStyle}">${!iconUrl ? g.name.charAt(0).toUpperCase() : ''}</div>
            <div class="card-check"><i class="fas fa-check"></i></div>
            ${locked ? '' : ''}
            <div class="card-body">
                <div class="card-name-row">
                    <div class="card-name" title="${g.name}">${g.name}</div>
                    <div class="card-badges">${badge}</div>
                </div>
                <div class="card-footer">
                    <span class="card-id">${g.id}</span>
                    <button class="btn-link invite-btn" title="Copy Invite"><i class="fas fa-link"></i></button>
                </div>
            </div>
        `;
        card.addEventListener('click', (e) => {
            if (e.target.closest('.invite-btn')) return;
            toggleSel(g.id, card);
        });
        card.querySelector('.invite-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            createInvite(g.id, card.querySelector('.invite-btn'));
        });
        card.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleLock(g.id, card); });
        scene.appendChild(card);
        frag.appendChild(scene);
        setTimeout(() => initTilt(card), 0);
    });
    el.serversGrid.appendChild(frag);
}

function renderDMs(dms) {
    const total = Math.ceil(dms.length / perPage);
    const start = (currentPage - 1) * perPage;
    const page = dms.slice(start, start + perPage);
    el.itemCount.textContent = dms.length;
    el.pageInfo.textContent = `${currentPage} / ${total || 1}`;
    el.prev.disabled = currentPage === 1;
    el.next.disabled = currentPage >= total;
    el.dmsGrid.innerHTML = '';
    const frag = document.createDocumentFragment();
    page.forEach(dm => {
        const scene = document.createElement('div');
        scene.className = 'card-scene';
        const card = document.createElement('div');
        const locked = lockedDMs.has(dm.id);
        const selected = selectedDMs.has(dm.id);
        card.className = `server-card ${selected ? 'selected' : ''} ${locked ? 'locked' : ''}`;
        card.dataset.id = dm.id;
        let name, avatarUrl, badge = '';
        if (dm.type === 1) {
            const r = dm.recipients[0];
            name = r.username;
            avatarUrl = r.avatar ? `https://cdn.discordapp.com/avatars/${r.id}/${r.avatar}.png` : null;
            if (r.bot) badge = `<span class="badge admin">Bot</span>`;
        } else {
            name = dm.name || dm.recipients.map(r => r.username).join(', ');
            avatarUrl = dm.icon ? `https://cdn.discordapp.com/channel-icons/${dm.id}/${dm.icon}.png` : null;
            badge = `<span class="badge owner">Group</span>`;
        }
        const iconStyle = avatarUrl ? `background-image: url('${avatarUrl}'); font-size:0;` : '';
        card.innerHTML = `
            <div class="card-banner">
                <div class="card-banner-inner" style="background: linear-gradient(135deg, #1a1a28, #0c0c14);"></div>
                <div class="card-banner-fade"></div>
            </div>
            <div class="card-avatar" style="${iconStyle}">${!avatarUrl ? name.charAt(0).toUpperCase() : ''}</div>
            <div class="card-check"><i class="fas fa-check"></i></div>
            <div class="card-body">
                <div class="card-name-row">
                    <div class="card-name" title="${name}">${name}</div>
                    <div class="card-badges">${badge}</div>
                </div>
                <div class="card-footer">
                    <span class="card-id">${dm.id}</span>
                    <div></div>
                </div>
            </div>
        `;
        card.addEventListener('click', () => toggleSelDM(dm.id, card));
        card.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleLockDM(dm.id, card); });
        scene.appendChild(card);
        frag.appendChild(scene);
        setTimeout(() => initTilt(card), 0);
    });
    el.dmsGrid.appendChild(frag);
}

function toggleSel(id, card) {
    if (lockedGuilds.has(id)) { showToast('This server is locked', 'error'); return; }
    if (selectedGuilds.has(id)) { selectedGuilds.delete(id); card.classList.remove('selected'); }
    else { selectedGuilds.add(id); card.classList.add('selected'); }
    updateActionBar();
}

function toggleSelDM(id, card) {
    if (lockedDMs.has(id)) { showToast('This DM is locked', 'error'); return; }
    if (selectedDMs.has(id)) { selectedDMs.delete(id); card.classList.remove('selected'); }
    else { selectedDMs.add(id); card.classList.add('selected'); }
    updateActionBar();
}

function toggleLock(id, card) {
    if (lockedGuilds.has(id)) { lockedGuilds.delete(id); card.classList.remove('locked'); showToast('Unlocked'); }
    else { selectedGuilds.delete(id); card.classList.remove('selected'); lockedGuilds.add(id); card.classList.add('locked'); showToast('Locked (Safe Mode)'); }
    updateActionBar();
}

function toggleLockDM(id, card) {
    if (lockedDMs.has(id)) { lockedDMs.delete(id); card.classList.remove('locked'); showToast('Unlocked'); }
    else { selectedDMs.delete(id); card.classList.remove('selected'); lockedDMs.add(id); card.classList.add('locked'); showToast('Locked'); }
    updateActionBar();
}

function toggleSelectAll() {
    const set = currentTab === 'servers' ? selectedGuilds : selectedDMs;
    const locked = currentTab === 'servers' ? lockedGuilds : lockedDMs;
    const items = currentTab === 'servers' ? allGuilds : allDMs;
    const selectable = items.filter(i => !locked.has(i.id));
    const allSel = selectable.every(i => set.has(i.id));
    selectable.forEach(i => allSel ? set.delete(i.id) : set.add(i.id));
    renderCurrent();
    updateActionBar();
}

function filterItems() {
    const q = el.search.value.toLowerCase();
    currentPage = 1;
    if (currentTab === 'servers') {
        renderServers(allGuilds.filter(g => g.name.toLowerCase().includes(q) || g.id.includes(q)));
    } else {
        renderDMs(allDMs.filter(d => {
            const n = d.type === 1 ? d.recipients[0].username : (d.name || d.recipients.map(r => r.username).join(', '));
            return n.toLowerCase().includes(q) || d.id.includes(q);
        }));
    }
}

function sortItems(criteria, el_) {
    currentPage = 1;
    if (sortCriteria === criteria) {
        if (currentTab === 'servers') { allGuilds = [...origGuilds]; renderServers(allGuilds); }
        else { allDMs = [...origDMs]; renderDMs(allDMs); }
        el_.classList.remove('active');
        sortCriteria = null;
        showToast('Sort reset');
        return;
    }
    sortCriteria = criteria;
    document.querySelectorAll('[data-sort]').forEach(a => a.classList.remove('active'));
    el_.classList.add('active');
    const sort = (arr, getName) => arr.sort((a, b) => {
        switch (criteria) {
            case 'name-asc': return getName(a).localeCompare(getName(b));
            case 'name-desc': return getName(b).localeCompare(getName(a));
            case 'newest': return BigInt(b.id) > BigInt(a.id) ? 1 : -1;
            case 'oldest': return BigInt(a.id) > BigInt(b.id) ? 1 : -1;
        }
    });
    if (currentTab === 'servers') { allGuilds = sort([...allGuilds], g => g.name); renderServers(allGuilds); }
    else { allDMs = sort([...allDMs], d => d.type === 1 ? d.recipients[0].username : (d.name || '')); renderDMs(allDMs); }
    showToast(`Sorted: ${criteria.replace('-', ' ')}`);
}

function handleSmartSelect(action, el_) {
    const set = currentTab === 'servers' ? selectedGuilds : selectedDMs;
    const locked = currentTab === 'servers' ? lockedGuilds : lockedDMs;
    const items = currentTab === 'servers' ? allGuilds : allDMs;
    const ids = items.filter(i => {
        if (locked.has(i.id)) return false;
        if (currentTab === 'servers') {
            if (action === 'no-icon') return !i.icon;
            if (action === 'non-admin') return !i.owner && !((BigInt(i.permissions) & 0x8n) === 0x8n);
        } else {
            if (action === 'bots') return i.type === 1 && i.recipients[0].bot;
            if (action === 'groups') return i.type === 3;
            if (action === 'users') return i.type === 1 && !i.recipients[0].bot;
        }
        return false;
    }).map(i => i.id);
    const active = el_.classList.contains('active');
    if (active) { ids.forEach(id => set.delete(id)); el_.classList.remove('active'); }
    else { ids.forEach(id => set.add(id)); el_.classList.add('active'); }
    renderCurrent();
    updateActionBar();
    showToast(`Smart: ${active ? 'Deselected' : 'Selected'} ${ids.length} items`);
}

function exportList() {
    const data = currentTab === 'servers' ? allGuilds : allDMs;
    if (!data.length) { showToast('Nothing to export', 'error'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `discord-${currentTab}-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    showToast('Exported!');
}

async function createInvite(guildId, btn) {
    if (isInviting) return;
    isInviting = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    btn.disabled = true;
    try {
        const res = await fetch(`${API}/guilds/${guildId}/channels`, { headers: { Authorization: token } });
        if (!res.ok) throw new Error('No access');
        const channels = await res.json();
        const ch = channels.find(c => c.type === 0);
        if (!ch) throw new Error('No channels');
        const inv = await fetch(`${API}/channels/${ch.id}/invites`, {
            method: 'POST',
            headers: { Authorization: token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ max_age: 86400, max_uses: 1 })
        });
        if (!inv.ok) throw new Error('No permission');
        const { code } = await inv.json();
        navigator.clipboard?.writeText(`https://discord.gg/${code}`).catch(() => {
            const t = document.createElement('textarea');
            t.value = `https://discord.gg/${code}`;
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            document.body.removeChild(t);
        });
        showToast('Invite copied!');
    } catch (e) {
        const link = `https://discord.com/channels/${guildId}`;
        navigator.clipboard?.writeText(link).catch(() => {});
        showToast('Copied server link (limited perms)', 'error');
    } finally {
        btn.innerHTML = '<i class="fas fa-link"></i>';
        btn.disabled = false;
        isInviting = false;
    }
}

async function processSelected() {
    if (isProcessing) { showToast('Already processing…', 'error'); return; }
    const set = currentTab === 'servers' ? selectedGuilds : selectedDMs;
    const n = set.size;
    if (!confirm(`${currentTab === 'servers' ? 'Leave/delete' : 'Close'} ${n} ${currentTab}? This cannot be undone.`)) return;
    isProcessing = true;
    el.processBtn.disabled = true;
    let done = 0;
    if (currentTab === 'servers') {
        for (const id of Array.from(set)) {
            el.processBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${++done}/${n}`;
            const g = allGuilds.find(x => x.id === id);
            const ep = g?.owner ? `${API}/guilds/${id}` : `${API}/users/@me/guilds/${id}`;
            try {
                const r = await fetch(ep, { method: 'DELETE', headers: { Authorization: token } });
                if (r.ok || r.status === 404) {
                    selectedGuilds.delete(id);
                    allGuilds = allGuilds.filter(x => x.id !== id);
                    document.querySelector(`.server-card[data-id="${id}"]`)?.closest('.card-scene')?.remove();
                }
            } catch {}
            await new Promise(r => setTimeout(r, 1000));
        }
    } else {
        for (const id of Array.from(set)) {
            el.processBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${++done}/${n}`;
            try {
                const r = await fetch(`${API}/channels/${id}`, { method: 'DELETE', headers: { Authorization: token } });
                if (r.ok || r.status === 404) {
                    selectedDMs.delete(id);
                    allDMs = allDMs.filter(x => x.id !== id);
                    document.querySelector(`.server-card[data-id="${id}"]`)?.closest('.card-scene')?.remove();
                }
            } catch {}
            await new Promise(r => setTimeout(r, 1000));
        }
    }
    isProcessing = false;
    el.processBtn.disabled = false;
    el.processBtn.innerHTML = `<i class="fas fa-arrow-right-from-bracket"></i> ${currentTab === 'servers' ? 'Leave' : 'Close'} Selected`;
    const items = currentTab === 'servers' ? allGuilds : allDMs;
    const tp = Math.max(1, Math.ceil(items.length / perPage));
    if (currentPage > tp) currentPage = tp;
    updateActionBar();
    updateStats();
    showToast(`Processed ${done} ${currentTab}`);
}
